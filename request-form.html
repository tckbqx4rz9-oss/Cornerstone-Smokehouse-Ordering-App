<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cornerstone Smokehouse — Get an Instant Quote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700;900&family=Work+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --char:#3B2F2F;
    --iron:#5A4A42;
    --ember:#B5651D;
    --ember-dark:#8B4513;
    --mustard:#C9A66B;
    --paper:#F5F5F0;
    --paper-dark:#EDE4D3;
    --card:#FBF8F2;
    --smoke:#8A7F72;
    --line:#D8CFC0;
    --good:#3E5C3A;
    --warn:#9C4221;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);
    background-image:repeating-linear-gradient(135deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 14px);
    font-family:'Work Sans', sans-serif;color:var(--char);-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:640px;margin:0 auto;padding:0 0 60px;}
  header{background:var(--char);padding:0;}
  header img{width:100%;display:block;}
  .tagline{font-family:'IBM Plex Mono', monospace;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;color:var(--mustard);padding:14px 24px 0;background:var(--char);}
  .subtitle{font-size:14px;color:#D9CFC2;padding:6px 24px 20px;max-width:48ch;line-height:1.5;background:var(--char);}

  .card{background:var(--card);margin:22px 20px 0;border:1px solid var(--line);border-radius:2px;}
  .card-head{padding:14px 18px;border-bottom:1px dashed var(--line);}
  .card-head h2{font-family:'Roboto Slab', serif;font-size:15px;margin:0;text-transform:uppercase;letter-spacing:0.4px;}
  .card-body{padding:18px;}
  .field{margin-bottom:14px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  label{display:block;font-family:'IBM Plex Mono', monospace;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;color:var(--smoke);margin-bottom:5px;}
  input[type=text], input[type=email], input[type=tel], input[type=number]{
    width:100%;padding:10px 11px;border:1px solid var(--line);background:#fff;
    border-radius:2px;font-family:'Work Sans', sans-serif;font-size:15px;color:var(--char);
  }
  input:focus{outline:2px solid var(--ember);outline-offset:1px;}

  .service-toggle{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;}
  .service-btn{flex:1;font-family:'Roboto Slab', serif;font-weight:700;font-size:12.5px;letter-spacing:0.4px;text-transform:uppercase;background:#fff;color:var(--smoke);border:none;padding:11px 6px;cursor:pointer;}
  .service-btn+.service-btn{border-left:1px solid var(--line);}
  .service-btn.active{background:var(--ember);color:#fff;}

  .item-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line);}
  .item-row:last-child{border-bottom:none;}
  .item-row input[type=checkbox]{width:19px;height:19px;accent-color:var(--ember);flex-shrink:0;}
  .item-name{font-size:14.5px;font-weight:500;}
  .item-sub{font-size:11.5px;color:var(--smoke);margin-top:1px;}
  .group-label{font-family:'IBM Plex Mono', monospace;font-size:10.5px;letter-spacing:1.5px;text-transform:uppercase;color:var(--ember-dark);margin:16px 0 2px;}
  .group-label:first-child{margin-top:0;}

  button.primary{width:100%;background:var(--ember);color:#fff;border:none;padding:16px;font-family:'Roboto Slab', serif;font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:0.6px;border-radius:2px;cursor:pointer;}
  button.primary:hover{background:var(--ember-dark);}
  button.primary:disabled{opacity:0.6;cursor:default;}
  button.secondary{width:100%;background:var(--char);color:var(--paper);border:none;padding:14px;font-family:'Roboto Slab', serif;font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:0.5px;border-radius:2px;cursor:pointer;}

  .note{font-size:12px;color:var(--smoke);line-height:1.5;background:var(--paper-dark);border-left:3px solid var(--mustard);padding:10px 12px;margin-top:14px;border-radius:2px;}
  #formError{display:none;background:#F5E3DA;border-left:3px solid var(--warn);color:var(--warn);font-size:13px;padding:10px 12px;margin:14px 20px 0;border-radius:2px;}

  #quoteResult{display:none;}
  .quote-table{width:100%;border-collapse:collapse;font-size:14px;}
  .quote-table td{padding:9px 4px;border-bottom:1px dashed var(--line);}
  .quote-table td.amt{text-align:right;font-family:'IBM Plex Mono', monospace;white-space:nowrap;}
  .quote-table tr.total td{border-bottom:none;border-top:2px solid var(--char);font-weight:700;padding-top:12px;font-size:17px;}

  #requestSection{display:none;}
  #requestMsg{display:none;padding:12px 14px;border-radius:2px;font-size:14px;margin-top:14px;}
  #requestMsg.success{display:block;background:#E7EFE6;border-left:3px solid var(--good);color:var(--good);}
  #requestMsg.error{display:block;background:#F5E3DA;border-left:3px solid var(--warn);color:var(--warn);}

  footer{text-align:center;font-family:'IBM Plex Mono', monospace;font-size:10.5px;letter-spacing:1px;color:var(--smoke);padding:30px 20px 0;text-transform:uppercase;}
</style>
</head>

    <div class="tagline">Instant Quote</div>
    <div class="subtitle">Pick your guest count and menu — see your price right away. All orders require advance notice.</div>

  <div class="card">
    <div class="card-head"><h2>Your Event</h2></div>
    <div class="card-body">
      <div class="field">
        <label for="eventName">Event / Client Name</label>
        <input type="text" id="eventName" placeholder="e.g. Miller Wedding">
      </div>
      <div class="grid2">
        <div class="field">
          <label for="eventDate">Event Date</label>
          <input type="date" id="eventDate">
        </div>
        <div class="field">
          <label for="serveTime">Serve Time</label>
          <input type="time" id="serveTime">
        </div>
      </div>
      <div class="field">
        <label for="guests">Guest Count</label>
        <input type="number" id="guests" min="1" placeholder="e.g. 75">
      </div>
      <div class="field">
        <label>Service Method</label>
        <div class="service-toggle">
          <button type="button" class="service-btn active" data-method="pickup" onclick="setMethod('pickup')">Pickup</button>
          <button type="button" class="service-btn" data-method="delivery" onclick="setMethod('delivery')">Delivery</button>
          <button type="button" class="service-btn" data-method="served" onclick="setMethod('served')">Served</button>
        </div>
      </div>
      <div class="field" id="addressField" style="display:none;">
        <label for="address">Event Address</label>
        <input type="text" id="address" placeholder="e.g. 1201 W Idaho St, Boise, ID">
      </div>
    </div>
  </div>

  <div class="card">
    <div class="card-head"><h2>Menu</h2></div>
    <div class="card-body" id="menuRows"></div>
  </div>

  <div style="padding:0 20px;">
    <div id="formError"></div>
    <button class="primary" style="margin-top:18px;" onclick="calculateQuote()">See My Price</button>
  </div>

  <div class="card" id="quoteResult">
    <div class="card-head"><h2>Your Estimate</h2></div>
    <div class="card-body">
      <table class="quote-table" id="quoteTable"></table>
      <div class="note" id="quoteNote"></div>
    </div>
  </div>

  <div style="padding:0 20px;" id="requestSection">
    <button class="secondary" onclick="showRequestForm()">This Works For Me — Request It</button>
  </div>

  <div class="card" id="requestForm" style="display:none;">
    <div class="card-head"><h2>Your Info</h2></div>
    <div class="card-body">
      <div class="field">
        <label for="reqName">Name</label>
        <input type="text" id="reqName" required>
      </div>
      <div class="field">
        <label for="reqEmail">Email</label>
        <input type="email" id="reqEmail" required>
      </div>
      <div class="field">
        <label for="reqPhone">Phone (optional)</label>
        <input type="tel" id="reqPhone">
      </div>
      <button class="primary" id="submitRequestBtn" onclick="submitRequest()">Send Request</button>
      <div id="requestMsg"></div>
    </div>
  </div>

  <footer>Cornerstone Smokehouse · Boise, ID</footer>
</div>

<script>
/* ---------- menu data (kept in sync with the internal planner) ---------- */
const MEATS = [
  {key:'brisket', name:'Texas-Style Beef Brisket', price:30.99, min:6, cookedLbPerPerson:0.20, avgBirdOrPiece:18, cookedYieldPct:0.50},
  {key:'pork',    name:'Pulled Pork',               price:19.99, min:5, cookedLbPerPerson:0.22, cookedYieldPct:0.55},
  {key:'chicken', name:'Smoked Chicken Breast',      price:20.99, min:3, cookedLbPerPerson:0.25, cookedYieldPct:0.72},
  {key:'tritip',  name:'Tri Tip',                    price:28.99, min:2, cookedLbPerPerson:0.23, cookedYieldPct:0.75}
];
const TURKEY = {key:'turkey', name:'Whole Smoked Turkey', price:110, avgBirdLb:13.5, cookedLbPerPerson:0.16, cookedYieldPct:0.45};
const RIBS = [
  {key:'babyback', name:'Baby Back Ribs',      fullPrice:33.99, racksPerPerson:0.22},
  {key:'stlouis',  name:'St. Louis-Style Ribs', fullPrice:33.99, racksPerPerson:0.22},
  {key:'beefribs', name:'Beef Ribs',           fullPrice:35.99, racksPerPerson:0.18}
];
const SIDES = [
  {key:'beans',       name:'Baked Beans',                price:37.99, servesPerPan:22},
  {key:'coleslaw',    name:'Creamy Coleslaw',             price:29.99, servesPerPan:22},
  {key:'potatosalad', name:'Potato Salad',                price:44.99, servesPerPan:22},
  {key:'mac',         name:'Mac &amp; Cheese',            price:44.99, servesPerPan:22},
  {key:'smashed',     name:'Crispy Smashed Potatoes',     price:44.99, servesPerPan:10}
];
const BAKED_POTATO = {key:'bakedpotato', name:'Baked Potatoes (plain)', packPrice:20, packSize:6, ratePerPerson:1};
const CORNBREAD = {key:'cornbread', name:'Cornbread', price:9.99, servesPerPan:9};
const BREAD = [
  {key:'rolls', name:'Dinner Rolls', packPrice:11.99, packSize:12, perPerson:1.25}
];
const MARKUP = 1;
const SUPPLIES = {key:'platesutensils', name:'Plates, Utensils &amp; Napkins', pricePerGuest:0.22};
const SERVICE_FEES = {
  pickup:   {label:'Pickup'},
  delivery: {label:'Delivery', flatFee:15, freeMiles:10, perMile:2},
  served:   {label:'Served',   perGuest:4}
};
let serviceMethod = 'pickup';

const FORMSPREE_ENDPOINT = 'https://formspree.io/f/xgoggdkb';

function setMethod(method){
  serviceMethod = method;
  document.querySelectorAll('.service-btn').forEach(b=>b.classList.toggle('active', b.dataset.method===method));
  document.getElementById('addressField').style.display = (method==='pickup') ? 'none' : '';
  document.getElementById('quoteResult').style.display = 'none';
  document.getElementById('requestSection').style.display = 'none';
}

/* ---------- build menu checklist ---------- */
const menuEl = document.getElementById('menuRows');
function row(key, name, sub, exactUnit, exactPlaceholder){
  return `<div class="item-row" data-key="${key}">
    <input type="checkbox" id="chk_${key}">
    <div style="flex:1;"><div class="item-name">${name}</div><div class="item-sub">${sub}</div></div>
    <div style="text-align:right;">
      <input type="number" min="0" step="1" id="exact_${key}" placeholder="${exactPlaceholder}" style="width:56px;text-align:right;padding:6px 7px;font-size:13px;">
      <div style="font-size:10px;color:var(--smoke);margin-top:2px;">exact ${exactUnit}</div>
    </div>
  </div>`;
}
menuEl.insertAdjacentHTML('beforeend', '<div class="group-label">Smoked Meats</div>');
menuEl.insertAdjacentHTML('beforeend', '<div class="note" style="margin:0 0 10px;">Leave "exact" blank to auto-calculate from guest count, or enter a specific amount to order that regardless of headcount (e.g. 1 pan of mac and cheese).</div>');
MEATS.forEach(m=>menuEl.insertAdjacentHTML('beforeend', row(m.key, m.name, `$${m.price.toFixed(2)}/lb`, 'lb', 'e.g. 20')));
menuEl.insertAdjacentHTML('beforeend', '<div class="group-label">Whole Turkey</div>');
menuEl.insertAdjacentHTML('beforeend', row(TURKEY.key, TURKEY.name, `$${TURKEY.price.toFixed(2)} each`, 'whole', 'e.g. 2'));
menuEl.insertAdjacentHTML('beforeend', '<div class="group-label">Ribs</div>');
RIBS.forEach(r=>menuEl.insertAdjacentHTML('beforeend', row(r.key, r.name, `$${r.fullPrice.toFixed(2)}/rack`, 'racks', 'e.g. 4')));
menuEl.insertAdjacentHTML('beforeend', '<div class="group-label">Sides</div>');
SIDES.forEach(s=>menuEl.insertAdjacentHTML('beforeend', row(s.key, s.name, `$${s.price.toFixed(2)}/pan`, 'pans', 'e.g. 1')));
menuEl.insertAdjacentHTML('beforeend', row(BAKED_POTATO.key, BAKED_POTATO.name, `$${BAKED_POTATO.packPrice.toFixed(2)} per ${BAKED_POTATO.packSize}`, 'ct', 'e.g. 30'));
menuEl.insertAdjacentHTML('beforeend', '<div class="group-label">Bread</div>');
menuEl.insertAdjacentHTML('beforeend', row(CORNBREAD.key, CORNBREAD.name, `$${CORNBREAD.price.toFixed(2)}/pan`, 'pans', 'e.g. 1'));
BREAD.forEach(b=>menuEl.insertAdjacentHTML('beforeend', row(b.key, b.name, `$${b.packPrice.toFixed(2)}/dozen`, 'dozen', 'e.g. 5')));
menuEl.insertAdjacentHTML('beforeend', '<div class="group-label">Extras</div>');
menuEl.insertAdjacentHTML('beforeend', row(SUPPLIES.key, SUPPLIES.name, `$${SUPPLIES.pricePerGuest.toFixed(2)}/guest`, 'sets', 'e.g. 75'));

function roundUp(n, step){ return Math.ceil(n/step)*step; }
function money(n){ return '$'+n.toFixed(2); }
function showFormError(msg){ const el=document.getElementById('formError'); el.textContent=msg; el.style.display='block'; el.scrollIntoView({behavior:'smooth', block:'center'}); }
function clearFormError(){ const el=document.getElementById('formError'); el.style.display='none'; el.textContent=''; }

let lastQuote = null;

function calculateQuote(){
  clearFormError();
  const eventDate = document.getElementById('eventDate').value;
  const serveTime = document.getElementById('serveTime').value;
  if(!eventDate){ showFormError('Pick your event date first.'); return; }
  if(!serveTime){ showFormError('Pick your serve time first.'); return; }
  const guestsVal = document.getElementById('guests').value;
  if(!guestsVal || parseInt(guestsVal)<=0){ showFormError('Enter a guest count first.'); return; }
  const guests = parseInt(guestsVal);
  const address = document.getElementById('address').value.trim();
  if(serviceMethod!=='pickup' && !address){ showFormError(`Enter the event address for ${SERVICE_FEES[serviceMethod].label.toLowerCase()}.`); return; }

  const lineItems = [];
  const checkedKeys = []; // {key, exact} for every checked item — feeds the planner prefill link
  let total = 0;
  let anyChecked = false;
  function exactVal(key){
    const v = document.getElementById('exact_'+key).value;
    return v ? Math.max(0, Math.round(parseFloat(v))) : null;
  }

  MEATS.forEach(m=>{
    if(!document.getElementById('chk_'+m.key).checked) return;
    anyChecked = true;
    const exact = exactVal(m.key);
    checkedKeys.push({key:m.key, exact});
    const finalCookedLbs = exact!==null ? Math.max(exact, m.min) : Math.max(roundUp(m.cookedLbPerPerson*guests, 1), m.min);
    const cost = finalCookedLbs*m.price*MARKUP;
    total += cost;
    lineItems.push({name:m.name, amt:`${finalCookedLbs} lb`, cost});
  });
  if(document.getElementById('chk_turkey').checked){
    anyChecked = true;
    const exact = exactVal('turkey');
    checkedKeys.push({key:'turkey', exact});
    let birds;
    if(exact!==null){ birds = Math.max(1, exact); }
    else { const rawBirds = (TURKEY.cookedLbPerPerson*guests)/(TURKEY.avgBirdLb*TURKEY.cookedYieldPct); birds = Math.max(1, Math.ceil(rawBirds)); }
    const cost = birds*TURKEY.price;
    total += cost;
    lineItems.push({name:TURKEY.name, amt:`${birds} whole`, cost});
  }
  RIBS.forEach(r=>{
    if(!document.getElementById('chk_'+r.key).checked) return;
    anyChecked = true;
    const exact = exactVal(r.key);
    checkedKeys.push({key:r.key, exact});
    const racks = exact!==null ? Math.max(1, exact) : Math.max(1, Math.ceil(r.racksPerPerson*guests));
    const cost = racks*r.fullPrice;
    total += cost;
    lineItems.push({name:r.name, amt:`${racks} racks`, cost});
  });
  SIDES.forEach(s=>{
    if(!document.getElementById('chk_'+s.key).checked) return;
    anyChecked = true;
    const exact = exactVal(s.key);
    checkedKeys.push({key:s.key, exact});
    const pans = exact!==null ? Math.max(1, exact) : Math.max(1, Math.ceil(guests/s.servesPerPan));
    const cost = pans*s.price*MARKUP;
    total += cost;
    lineItems.push({name:s.name, amt:`${pans} pan${pans>1?'s':''}`, cost});
  });
  if(document.getElementById('chk_bakedpotato').checked){
    anyChecked = true;
    const exact = exactVal('bakedpotato');
    checkedKeys.push({key:'bakedpotato', exact});
    const potatoCount = exact!==null ? exact : guests*BAKED_POTATO.ratePerPerson;
    const packs = Math.max(1, Math.ceil(potatoCount/BAKED_POTATO.packSize));
    const cost = packs*BAKED_POTATO.packPrice*MARKUP;
    total += cost;
    lineItems.push({name:BAKED_POTATO.name, amt:`${packs*BAKED_POTATO.packSize} ct`, cost});
  }
  if(document.getElementById('chk_cornbread').checked){
    anyChecked = true;
    const exact = exactVal('cornbread');
    checkedKeys.push({key:'cornbread', exact});
    const pans = exact!==null ? Math.max(1, exact) : Math.max(1, Math.ceil(guests/CORNBREAD.servesPerPan));
    const cost = pans*CORNBREAD.price*MARKUP;
    total += cost;
    lineItems.push({name:CORNBREAD.name, amt:`${pans} pan${pans>1?'s':''}`, cost});
  }
  BREAD.forEach(b=>{
    if(!document.getElementById('chk_'+b.key).checked) return;
    anyChecked = true;
    const exact = exactVal(b.key);
    checkedKeys.push({key:b.key, exact});
    const packs = exact!==null ? Math.max(1, exact) : Math.max(1, Math.ceil(Math.ceil(guests*b.perPerson)/b.packSize));
    const cost = packs*b.packPrice*MARKUP;
    total += cost;
    lineItems.push({name:b.name, amt:`${packs} dozen`, cost});
  });
  if(document.getElementById('chk_platesutensils').checked){
    anyChecked = true;
    const exact = exactVal('platesutensils');
    checkedKeys.push({key:'platesutensils', exact});
    const count = exact!==null ? exact : guests;
    const cost = count*SUPPLIES.pricePerGuest*MARKUP;
    total += cost;
    lineItems.push({name:SUPPLIES.name, amt:`${count} sets`, cost});
  }

  if(!anyChecked){ showFormError('Check at least one menu item.'); return; }

  if(serviceMethod==='served'){
    const fee = guests*SERVICE_FEES.served.perGuest;
    total += fee;
    lineItems.push({name:'Full-Service Staffing', amt:`${guests} guests`, cost:fee});
  }

  lastQuote = {guests, serviceMethod, address, eventDate, serveTime, eventName:document.getElementById('eventName').value.trim(), lineItems, total, deliveryFeeApplied:false, checkedKeys};
  renderQuote(lastQuote);

  if(serviceMethod==='delivery'){
    document.getElementById('quoteNote').textContent = 'Calculating delivery fee…';
    updateDeliveryFee(lastQuote);
  } else {
    document.getElementById('quoteNote').textContent = 'This is an estimate — final pricing is confirmed when we follow up.';
  }
}

function renderQuote(quote){
  let rows = quote.lineItems.map(li=>`<tr><td>${li.name}</td><td class="amt">${money(li.cost)}</td></tr>`).join('');
  rows += `<tr class="total"><td>Estimated Total</td><td class="amt">${money(quote.total)}</td></tr>`;
  document.getElementById('quoteTable').innerHTML = rows;
  document.getElementById('quoteResult').style.display = 'block';
  document.getElementById('requestSection').style.display = 'block';
  document.getElementById('quoteResult').scrollIntoView({behavior:'smooth'});
}

/* ---------- delivery distance (OpenStreetMap Nominatim + OSRM — free, no API key) ---------- */
const CORNERSTONE_ADDRESS = '4041 S. Argonaut Ave., Boise, ID 83709';
let cornerstoneCoords = null;

async function geocodeAddress(address){
  const url = `https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(address)}`;
  const res = await fetch(url, {headers:{'Accept':'application/json'}});
  if(!res.ok) throw new Error('Geocoding service unavailable.');
  const data = await res.json();
  if(!data.length) throw new Error('Address not found.');
  return {lat:parseFloat(data[0].lat), lon:parseFloat(data[0].lon)};
}
async function driveDistanceMinutes(from, to){
  const url = `https://router.project-osrm.org/route/v1/driving/${from.lon},${from.lat};${to.lon},${to.lat}?overview=false`;
  const res = await fetch(url);
  if(!res.ok) throw new Error('Routing service unavailable.');
  const data = await res.json();
  if(!data.routes || !data.routes.length) throw new Error('No driving route found.');
  return {miles: data.routes[0].distance/1609.34};
}
async function updateDeliveryFee(quote){
  try{
    if(!cornerstoneCoords) cornerstoneCoords = await geocodeAddress(CORNERSTONE_ADDRESS);
    const jobsiteCoords = await geocodeAddress(quote.address);
    const {miles} = await driveDistanceMinutes(cornerstoneCoords, jobsiteCoords);
    const f = SERVICE_FEES.delivery;
    const billableMiles = Math.max(0, miles-f.freeMiles);
    const fee = f.flatFee + billableMiles*f.perMile;
    quote.total += fee;
    quote.deliveryFeeApplied = true;
    quote.lineItems.push({name:`Delivery Fee (${miles.toFixed(1)} mi)`, amt:'', cost:fee});
    renderQuote(quote);
    document.getElementById('quoteNote').textContent = 'This is an estimate — final pricing is confirmed when we follow up.';
  } catch(err){
    document.getElementById('quoteNote').textContent = "Couldn't calculate the delivery fee automatically — we'll confirm it when we follow up.";
  }
}

/* ---------- request step ---------- */
function showRequestForm(){
  document.getElementById('requestForm').style.display = '';
  document.getElementById('requestForm').scrollIntoView({behavior:'smooth'});
}

function buildItemsParam(){
  const allKeys = [...MEATS.map(m=>m.key), TURKEY.key, ...RIBS.map(r=>r.key), ...SIDES.map(s=>s.key), BAKED_POTATO.key, CORNBREAD.key, ...BREAD.map(b=>b.key), SUPPLIES.key];
  const parts = [];
  allKeys.forEach(key=>{
    const chk = document.getElementById('chk_'+key);
    if(!chk || !chk.checked) return;
    const exactField = document.getElementById('exact_'+key);
    const exactVal = exactField && exactField.value ? exactField.value : '';
    parts.push(exactVal ? `${key}:${exactVal}` : key);
  });
  return parts.join(',');
}

function buildPlannerLink(name, email, phone){
  const params = new URLSearchParams();
  if(lastQuote.eventName) params.set('en', lastQuote.eventName);
  if(lastQuote.eventDate) params.set('ed', lastQuote.eventDate);
  if(lastQuote.serveTime) params.set('st', lastQuote.serveTime);
  params.set('g', lastQuote.guests);
  params.set('sm', lastQuote.serviceMethod);
  if(lastQuote.address) params.set('addr', lastQuote.address);
  const cc = [name, email, phone].filter(Boolean).join(', ');
  if(cc) params.set('cc', cc);
  const items = buildItemsParam();
  if(items) params.set('items', items);
  params.set('auto', '1');
  const base = window.location.href.replace(/request-form\.html.*$/, '');
  return base + 'index.html?' + params.toString();
}

async function submitRequest(){
  const name = document.getElementById('reqName').value.trim();
  const email = document.getElementById('reqEmail').value.trim();
  const phone = document.getElementById('reqPhone').value.trim();
  const msg = document.getElementById('requestMsg');
  msg.className = ''; msg.style.display = 'none';
  if(!name || !email){
    msg.className = 'error'; msg.textContent = 'Name and email are required.'; msg.style.display='block';
    return;
  }
  const btn = document.getElementById('submitRequestBtn');
  btn.disabled = true; btn.textContent = 'Sending…';

  const orderSummary = lastQuote.lineItems.map(li=>`${li.name}${li.amt?' — '+li.amt:''}: ${money(li.cost)}`).join('\n');
  const body = new FormData();
  const plannerLink = buildPlannerLink(name, email, phone);
  body.append('planner_link', plannerLink);
  body.append('name', name);
  body.append('email', email);
  body.append('phone', phone);
  body.append('event_name', lastQuote.eventName);
  body.append('event_date', lastQuote.eventDate);
  body.append('serve_time', lastQuote.serveTime);
  body.append('guest_count', lastQuote.guests);
  body.append('service_method', SERVICE_FEES[lastQuote.serviceMethod].label);
  body.append('address', lastQuote.address);
  body.append('order_summary', orderSummary);
  body.append('estimated_total', money(lastQuote.total));

  try{
    const res = await fetch(FORMSPREE_ENDPOINT, {method:'POST', body, headers:{'Accept':'application/json'}});
    if(res.ok){
      msg.className = 'success';
      msg.textContent = "Thanks! We've got your request and estimate — we'll be in touch soon.";
    } else {
      throw new Error('failed');
    }
  } catch(err){
    msg.className = 'error';
    msg.textContent = 'Something went wrong sending your request — please try again.';
  } finally {
    msg.style.display = 'block';
    btn.disabled = false; btn.textContent = 'Send Request';
  }
}
</script>
